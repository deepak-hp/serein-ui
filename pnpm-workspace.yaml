packages:
  - packages/*
  - apps/*

# Supply-chain cooldown: never install a version published less than 14 days ago.
minimumReleaseAge: 20160

# Install scripts are blocked by default in pnpm 10; list a package here only after reviewing it.
onlyBuiltDependencies: []

# Reviewed: these ship prebuilt platform binaries as optional dependencies; their install scripts are not needed.
ignoredBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
  - unrs-resolver
# One-off exception approved on 2026-10-25: Expo SDK 58 (expo 58.0.11, react-native 0.88.0) for
# packages/native and apps/native-playground, because Expo Go only runs SDK 58. Exact versions only, each the
# oldest that satisfies its requirement. 2g is an @expo/cli and @expo/metro-config dependency by an Expo maintainer.
# Remove this whole list once react-native 0.88.0 is 14 days old (about 2026-10-29); nothing else is exempt.
minimumReleaseAgeExclude:
  - "@expo/cli@58.1.9"
  - "@expo/config@58.0.6"
  - "@expo/config-plugins@58.0.9"
  - "@expo/config-types@58.0.3"
  - "@expo/env@2.5.2"
  - "@expo/fingerprint@0.21.5"
  - "@expo/image-utils@0.12.5"
  - "@expo/inline-modules@0.2.6"
  - "@expo/local-build-cache-provider@58.0.6"
  - "@expo/metro@58.0.0"
  - "@expo/metro-config@58.0.14"
  - "@expo/metro-file-map@58.0.5"
  - "@expo/modules-macros-win32-arm64@0.20.0"
  - "@expo/modules-macros-win32-x64@0.20.0"
  - "@expo/package-manager@1.14.2"
  - "@expo/prebuild-config@58.0.14"
  - "@expo/require-utils@58.0.4"
  - "@expo/router-server@58.0.14"
  - "@react-native/asset-utils@0.88.0"
  - "@react-native/babel-plugin-codegen@0.88.0"
  - "@react-native/codegen@0.88.0"
  - "@react-native/community-cli-plugin@0.88.0"
  - "@react-native/debugger-frontend@0.88.0"
  - "@react-native/debugger-shell@0.88.0"
  - "@react-native/dev-middleware@0.88.0"
  - "@react-native/gradle-plugin@0.88.0"
  - "@react-native/jest-preset@0.88.0"
  - "@react-native/js-polyfills@0.88.0"
  - "@react-native/normalize-colors@0.88.0"
  - "@react-native/virtualized-lists@0.88.0"
  - "2g@1.0.1"
  - "babel-preset-expo@58.0.15"
  - "expo@58.0.11"
  - "expo-asset@58.0.16"
  - "expo-constants@58.0.12"
  - "expo-file-system@58.0.9"
  - "expo-font@58.0.8"
  - "expo-modules-autolinking@58.0.13"
  - "expo-modules-core@58.0.19"
  - "expo-modules-jsi@58.0.14"
  - "expo-modules-macros@0.20.0"
  - "expo-server@58.0.5"
  - "jest-expo@58.0.11"
  - "react-native@0.88.0"
