name: Beta integration feedback
description: Report a real-application evaluation of the Serein React web beta.
body:
  - type: markdown
    attributes:
      value: >-
        Use sanitized test data. Do not include credentials, customer records, personal birth information,
        proprietary source, or suspected security vulnerabilities. Use SECURITY.md for private security reports.
  - type: input
    id: candidate
    attributes:
      label: Candidate and install provenance
      description: Package version, source commit, tarball filename and SHA-256, or verified registry version.
      placeholder: "@serein-ui/react@0.1.0 from npm, or commit … and tarball SHA-256 …"
    validations:
      required: true
  - type: textarea
    id: application
    attributes:
      label: Consuming application and environment
      description: Describe the application's purpose and stage, plus OS, browser, Node, React, React DOM and bundler versions. Do not name private customers.
    validations:
      required: true
  - type: dropdown
    id: task
    attributes:
      label: Primary task
      options:
        - Invoices or comparable records
        - Settings or comparable preferences
        - Onboarding or comparable setup
        - Package installation or build
        - Component API or documentation
        - Accessibility or user preference
        - Other real-application task
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Task, steps and expected outcome
      description: Include the starting state, exact actions and what should have happened.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Actual outcome
      description: State whether the task completed, any friction or workaround, and the smallest reproducible problem.
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: Failure and recovery result
      description: Describe the service, storage, validation or interruption failure tested; whether input survived; and whether retry recovered.
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: Keyboard, zoom and assistive technology
      description: Record methods and exact versions used, what was announced where relevant, or state that this review did not cover them.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and suggested change
      description: Add logs, screenshots or a minimal repository link only if they contain no sensitive data, and suggest an API, behavior or documentation change.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, customer data, personal birth information and proprietary source from this report and its attachments.
          required: true
