name: Release checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/packages/react/.playwright
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build every package
        run: pnpm build
      - name: Type-check
        run: pnpm typecheck
      - name: Unit, contrast, Tailwind and spec checks
        run: pnpm test
      - name: Verify beta packaging tooling
        working-directory: packages/react
        run: node --test scripts/prepare-beta-release.test.mjs
      - run: pnpm --filter @serein-ui/react exec playwright install --with-deps chromium firefox webkit
      - name: React release gate (package, SSR, consumer, AI, Storybook stories and UI checks)
        run: pnpm --filter @serein-ui/react check:release
      - name: Check focused accessibility scenarios across browser engines
        working-directory: packages/react
        run: |
          node scripts/check-accessibility-gaps.mjs chromium
          node scripts/check-accessibility-gaps.mjs firefox
          node scripts/check-accessibility-gaps.mjs webkit
      - name: Check compact checkbox layout and accessibility
        working-directory: packages/react
        run: node scripts/check-compact-checkbox.mjs
      - name: Verify installed package in Next.js App Router
        working-directory: packages/react/integration/next
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run setup
          npm ci --ignore-scripts
          npm run build
          npm run verify
      - name: Build documentation site (Storybook)
        run: pnpm --filter @serein-ui/react build:storybook
