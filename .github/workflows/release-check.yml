name: Release checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: trial
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/trial/.playwright
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: trial/package-lock.json
      - run: npm ci
      - name: Verify site, beta packaging and portable reviewer tooling
        run: node --test scripts/build-site.test.mjs scripts/check-site.test.mjs scripts/prepare-beta-release.test.mjs scripts/export-review-packet.test.mjs
      - run: npm exec -- playwright install --with-deps chromium firefox webkit
      - run: npm run check:release
      - run: npm run check:workflows
        env:
          BROWSER: firefox
      - run: npm run check:workflows
        env:
          BROWSER: webkit
      - name: Check focused accessibility scenarios across browser engines
        run: |
          node scripts/check-accessibility-gaps.mjs chromium
          node scripts/check-accessibility-gaps.mjs firefox
          node scripts/check-accessibility-gaps.mjs webkit
      - name: Check compact checkbox layout and accessibility
        run: node scripts/check-compact-checkbox.mjs
      - name: Verify installed package in Next.js App Router
        working-directory: trial/integration/next
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run setup
          npm ci --ignore-scripts
          npm run build
          npm run verify
      - name: Build public documentation artifact
        run: node scripts/build-site.mjs --base-path "$SITE_BASE"
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
      - name: Verify public documentation paths
        run: node scripts/check-site.mjs
